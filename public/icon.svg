<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- neon arch behind the figure -->
  <path d="M96 352 A160 160 0 0 1 416 352" fill="none" stroke="#e879f9" stroke-width="16" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- glowing platform -->
  <ellipse cx="256" cy="414" rx="150" ry="38" fill="none" stroke="#22d3ee" stroke-width="16" filter="url(#glow)"/>

  <!-- figure doing a jumping jack -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 206 L256 296"/>
    <path d="M168 112 L256 222 L344 112"/>
    <path d="M190 392 L256 296 L322 392"/>
  </g>
  <circle cx="256" cy="150" r="36" fill="#ffffff" filter="url(#glow)"/>
</svg>
